name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Byte-compile all .py files
        run: python -m compileall -q assistant_api assistant_giga

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff check (non-blocking, informational)
        run: ruff check assistant_api assistant_giga --output-format=github
        continue-on-error: true

  imports:
    name: Smoke (import API modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke-import FastAPI server module
        run: |
          cd assistant_api
          python -c "import importlib; importlib.import_module('api_server')"

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint-cli2 on main README
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: ".markdownlint.json"
          globs: "README.md"
